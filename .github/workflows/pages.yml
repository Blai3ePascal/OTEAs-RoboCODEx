name: Test and deploy RoboCODEx
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm test
      - name: Published room service smoke test
        run: node scripts/verify_rooms.mjs
      - run: python3 scripts/build.py
      - name: Generated blocks and Java lessons compile with ECJ
        run: node scripts/verify_blocks_java.mjs
      - name: Original Java engine smoke test
        run: |
          timeout 150 java -Dotea.symbols=runtime/jdk17-symbols.jar -cp 'runtime/*' otea.ArenaBridge runtime/robocode-home.zip /tmp/otea-robocode-test > /tmp/otea-java.log 2>&1
          python3 scripts/verify_java.py /tmp/otea-java.log
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
